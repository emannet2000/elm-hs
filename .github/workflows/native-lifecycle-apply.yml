name: Validate native lifecycle

on:
  push:
    branches:
      - work/native-lifecycle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global elm@0.19.1-6
      - name: Compile Elm
        working-directory: web
        run: elm make src/Main.elm --optimize --output=/tmp/main.js

  haskell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          cabal-version: 'latest'
      - name: Build and test Haskell
        working-directory: api
        run: |
          cabal update
          cabal build all -j2
          cabal test all -j2

  docker:
    needs: [elm, haskell]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t ecc-crm-native-lifecycle .
