name: ECC CRM Quality Gate

on:
  push:
    branches: [main, "improve/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Haskell build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: "latest"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            api/dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('api/ecc-crm-api.cabal') }}
          restore-keys: ${{ runner.os }}-cabal-
      - name: Update package index
        run: cabal update
      - name: Build backend
        working-directory: api
        run: cabal build all -j2
      - name: Run backend tests
        working-directory: api
        run: cabal test all -j2

  frontend:
    name: Elm production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repository tooling
        run: npm ci
      - name: Install Elm compiler
        run: npm install --global elm@0.19.1-6
      - name: Compile Elm with optimizations
        working-directory: web
        run: elm make src/Main.elm --optimize --output=/tmp/ecc-main.js

  container:
    name: Production container build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag ecc-crm:${{ github.sha }} .
