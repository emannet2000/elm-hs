# Apply through Render > New > Blueprint.
# This provisions a new service and database; it does not migrate existing data.
services:
  - type: web
    name: elm-hs
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: elm-hs-db
          property: connectionString
      - key: SEED_DEMO
        value: "false"
      - key: ALLOW_INSECURE_DEV
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"

databases:
  - name: elm-hs-db
    plan: free
    region: singapore
    databaseName: ecc_crm
    user: ecc_crm
    ipAllowList: []
